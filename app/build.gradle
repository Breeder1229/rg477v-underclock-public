plugins {
    id 'com.android.application'
}

// Signed native Control Center payload, generated by the integration build.
def controlCenterAssetDirectory = file("${buildDir}/generated/controlcenter")
def controlCenterPayload = new File(controlCenterAssetDirectory, 'control-center.apk')
def controlCenterSha256 = controlCenterPayload.isFile()
        ? java.security.MessageDigest.getInstance('SHA-256').digest(controlCenterPayload.bytes).encodeHex().toString()
        : ''

android {
    namespace 'io.github.breeder1229.rg477vunderclock'
    compileSdk 36
    buildToolsVersion '35.0.0'

    defaultConfig {
        applicationId 'io.github.breeder1229.rg477vunderclock'
        minSdk 26
        targetSdk 36
        versionCode 25
        versionName '1.00'
        resValue 'string', 'app_name', 'RG477V Under-clock'
        buildConfigField 'String', 'CONTROL_CENTER_SHA256', '"' + controlCenterSha256 + '"'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        debug {
            debuggable false
            resValue 'string', 'app_name', 'RG477V Under-clock'
        }
        release {
            debuggable false
            minifyEnabled false
        }
    }

    testOptions {
        unitTests.returnDefaultValues = false
    }
    buildFeatures { aidl false; buildConfig true }

    lint {
        abortOnError true
    }

    sourceSets {
        main.java.srcDir '../integration/control-center/shared'
        main.assets.srcDirs = ['../profiles', controlCenterAssetDirectory]
        test.java {
            srcDir '../integration/control-center'
            exclude 'UnderclockRuntime.java', 'UnderclockCard.java', 'PowerOverlay.java', 'ForegroundFrameSampler.java'
            exclude 'shared/**'
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
